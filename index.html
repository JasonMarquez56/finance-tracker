<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div>
    <h1>Transactions</h1>
    <div class="borderBox">
      <form id="txnForm">
        <b>Add Transaction</b>
        <div class="formGroup">
          <label>Type</label>
          <div class="formRow">
            <input id="incomeBtn" class="typeBtn" type="button" value="Income">
            <input id="expenseBtn" class="typeBtn" type="button" value="Expense">
          </div>
          <span id="typeError" style="display: none; color: red; font-size: 0.85em;">Please select Income or Expense.</span>
        </div>
        <div class="formGroup formRow">
          <div>
            <label>Payee</label>
            <input id="payeeInput" class="txtEntry" type="text" placeholder="Joes Coffee Shop" required>
          </div>
          <div>
            <label>Amount</label>
            <div class="amountWrap" style="width: 100%;">
              <span class="amountPrefix">$</span>
              <input id="amtInput" class="txtEntry" type="number" step="0.01" min="0" placeholder="0.00" required>
            </div>
          </div>
        </div>
        <div class="formGroup formRow">
          <div>
            <label for="category">Category</label>
            <select id="catInput" name="category" class="txtEntry" value="" required>
              <option value="" disabled selected>Select an option</option>
              <option value="Groceries">Groceries</option>
              <option value="Transportation">Transportation</option>
              <option value="Entertainment">Entertainment</option>
            </select>
          </div>
          <div>
            <label>Date</label>
            <input id="dateInput" class="typeSelector txtEntry" type="date" required>
          </div>
        </div>
        <div class="formGroup">
          <input type="submit" value="+ Add Transaction">
        </div>
      </form>
    </div>
    <div>
      <table id="transactionTable" style="text-align: left; border-spacing: 15px 0;">
        <tr>
          <th>Date</th>
          <th>Payee</th>
          <th>Category</th>
          <th>Amount</th>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
