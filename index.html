<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div>
    <form id="txnForm" class="borderBox">
      <div class="header-row">
        <h2>Add Transaction</h2>
        <div class="segmented">
          <button id="expenseBtn" class="typeBtn" type="button">Expense</button>
          <button id="incomeBtn" class="typeBtn" type="button">Income</button>
        </div>
      </div>
      <span id="typeError" class="type-error">Please select Income or Expense.</span>
      <div class="field-grid">
        <div class="field">
          <label>Payee</label>
          <input id="payeeInput" class="field-input" type="text" placeholder="Joes Coffee Shop" required />
        </div>
        <div class="field">
          <label>Amount</label>
          <input id="amtInput" class="field-input" type="number" step="0.01" min="0" placeholder="0.00" required />
        </div>
        <div class="field">
          <label>Category</label>
          <select id="catInput" required>
            <option value="" disabled selected>Select an option</option>
            <option value="Paycheck">Paycheck</option>
            <option value="Groceries">Groceries</option>
            <option value="Transportation">Transportation</option>
            <option value="Entertainment">Entertainment</option>
          </select>
        </div>
        <div class="field">
          <label>Date</label>
          <input id="dateInput" class="field-input" type="date" required />
        </div>
      </div>
      <div class="button-row">
        <button type="submit">Add Transaction</button>
      </div>
    </form>

    <div class="selection-row">
      <h3>Transactions</h3>
      <div class="selection-options">
        <p id="total-selected" class="total-selected">0 Selected</p>
        <button>Select All</button>
        <button onclick="deleteSelected()">Delete</button>
      </div>

    </div>

    <div class="borderBox">
      <table id="transactionTable">
        <tr>
          <th></th>
          <th>Date</th>
          <th>Payee</th>
          <th>Category</th>
          <th>Amount</th>
          <th></th>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
