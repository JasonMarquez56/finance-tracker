<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Finance Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
	<div>
    <div class="borderBox">
      <form id="txnForm">
        <label>Type</label><br>
        <input type="button" value="Income">
        <input type="button" value="Expense"><br>
        <div style="display: flex; gap: 20px">
          <div style="padding: 10px 0">
            <label>Description</label><br>
            <input id="descInput" type="text" required>
          </div>
          <div style="padding: 10px 0">
            <label>Amount</label><br>
            <div class="amountWrap">
              <span class="amountPrefix">$</span>
              <input id="amtInput" type="number" step="0.01" min="0" placeholder="0.00" required>
            </div>
          </div>
        </div>
        <div style="display: flex; gap: 20px">
          <div>
            <label for="category">Category</label><br>
              <select id="catInput" name="category" value="" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Groceries">Groceries</option>
                <option value="Transportation">Transportation</option>
                <option value="Entertainment">Entertainment</option>
              </select>
          </div>
          <div>
            <label>Date</label><br>
            <input id="dateInput" type="date" required>
          </div>
        </div>
        <div style="padding: 20px 0 0">
          <input type="submit" value="+ Add Transaction">
        </div>
      </form>
    </div>
    <div>
      <table id="transactionTable" style="text-align: left; border-spacing: 15px 0;">
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th>Amount</th>
        </tr>
        <tr>
          <td>2026-07-16</td>
          <td>Moana Tickets</td>
          <td>Entertainment</td>
          <td>$10</td>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
